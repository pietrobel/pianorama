    <meta property="og:title" content="PIANORAMA — Il laboratorio dei piani di lavoro" />

    <script>
      window.__pianoramaDeferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pianoramaDeferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pianorama:install-available'));
      });
      window.addEventListener('appinstalled', function () {
        window.__pianoramaDeferredInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pianorama:app-installed'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
